<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --cloud-dancer: #F0EEE4;   /* Pantone Cloud Dancer 11-4201 (approssimato) */
      --nimbus-cloud: #8C8C8C;   /* Pantone Nimbus Cloud (approssimato) */
    }

    body {
      background-color: var(--cloud-dancer);
      color: var(--nimbus-cloud);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .hero {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .hero img {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      object-fit: contain;
    }

    .hero h1 {
      color: var(--nimbus-cloud);
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    #frase-random {
      color: var(--nimbus-cloud);
      font-size: 1rem;
      opacity: 0.8;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

  <div class="hero">
    <img src="logo.svg" alt="Logo">
    <h1>test di un test</h1>
    <p id="frase-random">Caricamento…</p>
  </div>

  <!-- Bootstrap JS (opzionale, per componenti interattivi futuri) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Carica frasi.txt (una frase per riga) e ne mostra una a caso ad ogni refresh
    fetch('frasi.txt')
      .then(res => {
        if (!res.ok) throw new Error('File frasi.txt non trovato');
        return res.text();
      })
      .then(testo => {
        const frasi = testo
          .split('\n')
          .map(r => r.trim())
          .filter(r => r.length > 0);

        if (frasi.length === 0) {
          document.getElementById('frase-random').textContent = '';
          return;
        }

        const scelta = frasi[Math.floor(Math.random() * frasi.length)];
        document.getElementById('frase-random').textContent = scelta;
      })
      .catch(err => {
        console.error(err);
        document.getElementById('frase-random').textContent = '';
      });
  </script>

</body>
</html>
